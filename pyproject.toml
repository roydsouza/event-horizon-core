[project]
name = "event-horizon-core"
version = "0.1.0"
description = "M5-Optimized Local LLM Inference Bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlx-lm",
    "requests",
    "click",
    "python-dotenv",
]

[project.scripts]
event-horizon = "event_horizon_core.cli:main"

[tool.setuptools]
packages = ["event_horizon_core"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
